services:
  jekyll:
    image: ruby:3.3
    working_dir: /site
    ports:
      - "4000:4000"
      - "35729:35729" # livereload
    volumes:
      - .:/site
      - bundle:/usr/local/bundle
    command: bash -c "(bundle check || bundle install) && bundle exec jekyll serve --host 0.0.0.0 --force_polling --livereload"

volumes:
  bundle:
